services:
  # No Postgres container: the database is Cloudflare D1 (remote), reached via the
  # `wrangler` CLI, which needs the host's `wrangler login` session. Because of that,
  # the backend/worker containers below need Node + the mounted wrangler config to
  # reach D1 - see README "Running natively vs Docker" for the currently-supported path.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python worker.py

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
